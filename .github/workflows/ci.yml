name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install and check tmux
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y tmux
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew list tmux >/dev/null 2>&1 || brew install tmux
          fi
          tmux -V

      - name: Install dependencies
        run: npm ci

      # The ambient gate asserts that ast-grep is present: without it the gate
      # would go quiet instead of red, which is the failure it exists to prevent.
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli@0.45.3

      # Build is explicit so TypeScript failures are named; npm ci and npm test also
      # invoke it through prepare and pretest.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publicity audit
        run: npm run audit

      # Ahead of init: that step runs backslop at the pin THIS file names and rewrites
      # AGENTS.md to it, so after it the gate would blame AGENTS.md instead of ci.yml.
      - name: Pin gate
        run: npm run pins

      # Adapter outputs and the Claude stub are generated, not stored in git, so a
      # fresh checkout has none of them and the gate would fail on their absence.
      # Regenerating first is what the tool expects: templates are the only source.
      - name: backslop init
        run: npx --yes github:Velklish/backslop#v0.6.0 init --prefix PB --lang en --tools claude,cursor,codex

      - name: backslop lint
        run: npm run lint:backslop

      # Live harness runs are never started in CI: they spend account limits
      # and write into the home directory. When a harness exists, keep it
      # local-only; do not add a workflow step that invokes it.
